<h2 mat-dialog-title>{{ "USER_DELETE_DIALOG.DIALOG_TITLE" | translate }}</h2>
<mat-dialog-content>{{
  "USER_DELETE_DIALOG.DIALOG_MESSAGE" | translate
}}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button mat-dialog-close color="basic" (click)="onCancel()">
    {{ "USER_DELETE_DIALOG.DIALOG_NO" | translate }}
  </button>
  <button
    mat-flat-button
    mat-dialog-close
    cdkFocusInitial
    color="warn"
    (click)="onConfirm()"
  >
    {{ "USER_DELETE_DIALOG.DIALOG_YES" | translate }}
  </button>
</mat-dialog-actions>
