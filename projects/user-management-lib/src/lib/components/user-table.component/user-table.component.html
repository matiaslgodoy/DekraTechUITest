<div class="table-container">
  <table
    mat-table
    [dataSource]="dataSource"
    matSort
    (matSortChange)="announceSortChange($event)"
    class="mat-elevation-z8"
  >
    <!-- Username Column -->
    <ng-container matColumnDef="username">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by Username"
      >
        Username
      </th>
      <td mat-cell *matCellDef="let element">{{ element.username }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by Name"
      >
        Name
      </th>
      <td mat-cell *matCellDef="let element">
        {{ element.username + element.username }}
      </td>
    </ng-container>

    <!-- age Column -->
    <ng-container matColumnDef="age">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by Age"
      >
        Age
      </th>
      <td mat-cell *matCellDef="let element">
        {{ element.dateOfBirth | age }}
      </td>
    </ng-container>

    <!-- DateCreated Column -->
    <ng-container matColumnDef="dateCreated">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by dateCreated"
      >
        DateCreated
      </th>
      <td mat-cell *matCellDef="let element">
        {{ element.dateCreated | date: "dd/MM/yyyy" }}
      </td>
    </ng-container>

    <!-- dateLastLoggin Column -->
    <ng-container matColumnDef="dateLastLoggin">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by dateLastLoggin"
      >
        dateLastLoggin
      </th>
      <td mat-cell *matCellDef="let element">
        {{ element.dateLastLoggin | date: "dd/MM/yyyy HH:mm" }}
      </td>
    </ng-container>

    <!-- active Column -->
    <ng-container matColumnDef="active">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by active"
      >
        active
      </th>
      <td mat-cell *matCellDef="let element">{{ element.active }}</td>
    </ng-container>

    <!-- option Column -->
    <ng-container matColumnDef="options">
      <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
      <td mat-cell *matCellDef="let element">
        <mat-icon
          aria-hidden="false"
          aria-label="Example home icon"
          fontIcon="edit"
        ></mat-icon>
        <mat-icon
          aria-hidden="false"
          aria-label="Example home icon"
          fontIcon="delete"
        ></mat-icon>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
